; Firmware for the Adafruit MatrixPortal S3 driving a 64x32 HUB75 panel.
; Build/flash:  pio run -t upload   (then: pio device monitor)
[env:matrixportal_s3]
platform = espressif32
board = adafruit_matrixportal_esp32s3
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<test_serial.cpp>
; Our firmware (USB CDC on boot) honors the 1200bps auto-reset, so a normal
; `pio run -t upload` should work now. If a flash fails to enter the bootloader,
; hold BOOT + tap RESET and retry.
build_flags =
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    adafruit/Adafruit Protomatter @ ^1.6.0
    links2004/WebSockets @ ^2.6.1
    bblanchon/ArduinoJson @ ^7.0.4
    adafruit/Adafruit seesaw Library @ ^1.7.7

; Minimal bring-up test: serial + solid-red panel only (no WiFi/seesaw).
[env:serialtest]
extends = env:matrixportal_s3
build_src_filter = -<*> +<test_serial.cpp>
board_upload.use_1200bps_touch = no
board_upload.wait_for_upload_port = no
