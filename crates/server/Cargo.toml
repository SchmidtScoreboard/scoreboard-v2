[package]
name = "server"
edition.workspace = true
# CalVer, matching the firmware release it ships (firmware-rs/Cargo.toml).
version = "2026.7.0"

# The OTA release signer (scripts/release-firmware.sh runs it). Explicit for
# discoverability — cargo would auto-discover src/bin/sign-firmware.rs anyway.
default-run = "server"

[[bin]]
name = "sign-firmware"
path = "src/bin/sign-firmware.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
scoreboard-protocol = { path = "../protocol" }
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
embedded-graphics = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
chrono-tz = "0.10"
image = { version = "0.25", default-features = false, features = ["png"] }
reqwest = { version = "0.12", features = ["json"] }
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = "0.3"
rand = "0.8"
hex = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
# The /guide routes drive a real board-core Board to render the device's own
# screens (promoted from dev-dependencies, where the wire tests already used it).
board-core = { path = "../board-core" }

[dev-dependencies]
tokio-tungstenite = "0.21"
