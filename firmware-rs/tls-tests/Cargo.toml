# Host-side tests for `../src/tls.rs` and `../src/creds.rs`.
#
# The firmware is a no_std xtensa binary, so `cargo test` can never run inside
# it. This crate compiles THE SAME SOURCE FILES for the host (`#[path]`, no
# copy, no drift) and exercises them against certificates minted by the same
# rcgen the server uses — so a change to the pin rules, the DER walk, the
# signature check, or the flash credential record fails here rather than on a
# board.
#
# Deliberately its own `[workspace]`: firmware-rs is a standalone xtensa
# workspace (see ../Cargo.toml) and this is a host crate.
#
#     cargo test --manifest-path firmware-rs/tls-tests/Cargo.toml
[workspace]

[package]
name = "tls-tests"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# Exactly what src/tls.rs needs. Versions match ../Cargo.toml and the firmware
# lockfile so the host is testing the same code the board runs.
embedded-tls = { version = "0.19.0", default-features = false }
ed25519-dalek = { version = "2", default-features = false, features = ["hazmat"] }
sha2 = { version = "0.10", default-features = false }
# What src/creds.rs needs: the `Storage` trait its load/save/clear are generic
# over, so the tests can drive them against a fake flash instead of a board.
embedded-storage = "0.3.1"

[dev-dependencies]
# The server mints its certificate with rcgen + PKCS_ED25519 (see
# crates/server/src/tls.rs), so the tests mint theirs the same way.
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
hex = "0.4"
# tests/handshake.rs runs a REAL rustls TLS 1.3 server — same version, same
# `ring` provider, same TLS-1.3-only builder, same 4096-byte fragment cap as
# crates/server — and completes a real handshake with the firmware's verifier.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
embedded-io = { version = "0.7", features = ["std"] }
rand_core = { version = "0.6", default-features = false }
ring = "0.17"
