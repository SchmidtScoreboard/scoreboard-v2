# Standalone workspace: this crate builds for xtensa-esp32s3 with the "esp"
# toolchain, separate from the main repo workspace (which is host std).
[workspace]

[package]
name = "firmware-rs"
# CalVer "YYYY.M.P" — this IS the firmware version: the board reports
# env!("CARGO_PKG_VERSION") to the server, and scripts/release-firmware.sh
# stamps it into firmware-dist/firmware.json. Bump it for every OTA release.
version = "2026.8.3"
edition = "2021"
default-run = "firmware-rs"

[features]
default = ["tls"]

# Select which server (in src/config.rs) the board talks to, at flash time:
#   cargo run --release             -> dev server
#   cargo run --release --features prod
prod = []

# TLS 1.3 on the device websocket, with the server's public key pinned
# (src/tls.rs). ON by default — every shipped image has it. Off only for
# bring-up against a plaintext server:
#   cargo build --release --no-default-features
# There is NO runtime fallback: a TLS build that can't complete the handshake
# retries, it does not downgrade. 7878 still serves plaintext, so a fallback
# would be a downgrade any on-path attacker could trigger.
tls = ["dep:embedded-tls", "dep:rand_core"]

# Versions match the esp-generate 1.3 reference (esp-hal ~1.1, esp-radio 0.18,
# esp-rtos 0.3, embassy-net 0.9). If anything fights, regenerate a reference with
# `esp-generate --headless --chip esp32s3 -o alloc -o wifi -o embassy -o unstable-hal`.
[dependencies]
esp-hal = { version = "1.1.1", features = ["esp32s3", "unstable"] }
esp-hub75 = { version = "0.11.0", features = ["esp32s3", "iram"] }
embedded-graphics = "0.8.2"
static_cell = "2.1.1"

# logging + panic over serial
esp-println = { version = "0.17.0", features = ["esp32s3"] }
esp-backtrace = { version = "0.19.0", features = ["esp32s3", "panic-handler", "println", "custom-halt"] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32s3"] }

# scheduler + radio + network stack
esp-rtos = { version = "0.3.0", features = ["embassy", "esp-alloc", "esp-radio", "esp32s3"] }
esp-radio = { version = "0.18.0", features = ["ble", "esp-alloc", "esp32s3", "unstable", "wifi"] }
esp-alloc = "0.10.0"
embassy-net = { version = "0.9.1", features = ["dhcpv4", "dns", "medium-ethernet", "tcp", "udp"] }
embassy-executor = "0.10.0"
embassy-time = "0.5.0"
embassy-sync = "0.7"
embedded-io-async = "0.7.0"
# TLS 1.3 client, no_std and allocator-free (caller-provided buffers). NO
# feature flags on purpose: the `ed25519`/`p384`/`rsa` features only gate
# embedded-tls's own PKI verifier, which does CA-chain validation against a
# clock the board doesn't have. `src/tls.rs` implements `TlsVerifier` itself —
# both halves, pin AND signature — against the `ed25519-dalek` already linked
# below for OTA image verification, so enabling `ed25519` would drag in
# `der 0.8.0-rc.2` + `const-oid` for code that never runs.
embedded-tls = { version = "0.19.0", default-features = false, optional = true }
# Only for the `CryptoRng` marker embedded-tls's RNG bound needs; esp-hal's
# `Rng` implements rand_core 0.6's `RngCore` but not `CryptoRng`.
rand_core = { version = "0.6.4", default-features = false, optional = true }
critical-section = "1.2.0"

# shared logic + protocol (no_std), JSON for the wire messages
scoreboard-protocol = { path = "../crates/protocol" }
board-core = { path = "../crates/board-core" }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
# OTA image verification. Same versions the protocol crate pins, but the
# firmware needs the INCREMENTAL APIs (sha2's Digest, dalek's StreamVerifier —
# hazmat feature): a ~1MB image streams to flash and never fits in RAM, so the
# protocol crate's one-shot sha256_hex/verify_hex helpers can't be used here.
sha2 = { version = "0.10", default-features = false }
ed25519-dalek = { version = "2", default-features = false, features = ["hazmat"] }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
smoltcp = { version = "0.13.0", default-features = false, features = [
  "medium-ethernet",
  "proto-dhcpv4",
  "proto-ipv4",
  "socket-tcp",
  "socket-udp",
] }
esp-storage = { version = "0.9.0", features = ["esp32s3"] }
embedded-storage = "0.3.1"
bt-hci = "0.8"
trouble-host = { version = "0.6", features = ["gatt"] }
embassy-futures = "0.1"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1

# esp-radio's BLE/Wi-Fi drivers REQUIRE opt-level 2/3 or they may silently fail
# to advertise or connect (per esp-radio docs). Keep the rest of the image at "s".
[profile.release.package.esp-radio]
opt-level = 3

[profile.dev]
opt-level = "s"

[profile.dev.package.esp-radio]
opt-level = 3
